name: Deploy Edge Functions

# O projecto NÃO está escrito aqui. Sai do `supabase/config.toml`, que é o mesmo
# ficheiro que a CLI, as migrações e os testes e2e usam.
#
# Porquê: até 03/10/2026 este workflow tinha `PROJECT_REF: ammlyqnjlhioukpgldgc`
# escrito à mão — a base "PM System", que é uma cópia de 12/09 e não a produção.
# A app lê `ybtrzqzliepknpzqdajx`. Nunca chegou a fazer estragos porque o workflow
# é `workflow_dispatch` e nunca foi corrido nenhuma vez; o estrago estava à espera
# do primeiro clique em "Run workflow", que teria publicado as funções na base
# errada e deixado a produção sem a correcção que se queria lá pôr.
#
# Duas fontes para a mesma verdade divergem sempre. Agora é uma só.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Publicar noutro projecto (deixar vazio = o do supabase/config.toml)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Decidir o projecto
        id: target
        run: |
          set -euo pipefail
          CONFIG_REF="$(sed -n 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' supabase/config.toml | head -1)"
          if [ -z "$CONFIG_REF" ]; then
            echo "::error::Não consegui ler project_id de supabase/config.toml."
            exit 1
          fi

          OVERRIDE="${{ inputs.project_ref }}"
          if [ -n "$OVERRIDE" ]; then
            REF="$OVERRIDE"
            echo "::warning::A publicar em $REF, que NÃO é o projecto do config.toml ($CONFIG_REF)."
          else
            REF="$CONFIG_REF"
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "### Projecto de destino: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REF" != "$CONFIG_REF" ]; then
            echo "> Sobreposto à mão. O \`supabase/config.toml\` diz \`$CONFIG_REF\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Listar funções encontradas
        run: |
          echo "Funções no repositório:"
          ls -1 supabase/functions | grep -v '^_' | sed 's/^/  - /'
          echo
          echo "Total: $(ls -1 supabase/functions | grep -v '^_' | wc -l)"

      - name: Deploy
        run: supabase functions deploy --project-ref "${{ steps.target.outputs.ref }}"

      - name: Confirmar
        run: supabase functions list --project-ref "${{ steps.target.outputs.ref }}"
