<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AN Maintenance</title>
    <meta name="description" content="AN Maintenance — Industrial Maintenance Management System" />
    <meta name="author" content="Applied Nutrition" />

    <!-- Uma marca só, declarada em todos os tamanhos que um browser pede. O
         separador trocava de ícone porque havia duas marcas a competir: o
         index.html apontava para /favicon.png (o átomo AN, quadrado) e o
         site.webmanifest para /android-chrome-*.png (o letreiro largo "Applied
         Nutrition Manutenção"), e o Chrome tanto pode usar um como o outro.
         Sem /favicon.ico, o pedido implícito do browser caía no index.html do
         SPA — HTML servido como ícone, que dá o globo cinzento. Agora todos os
         caminhos dão na mesma imagem. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1F4E79" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Três vozes, uma tarefa cada. Archivo é a face das chapas de máquina e da
         sinalética: entra só nos títulos e nas placas de secção, nunca em texto corrido.
         Inter faz a interface. Plex Mono faz os números — os deste sistema vêm de
         relógios e de máquinas, e um algarismo composto na mesma face da sua própria
         etiqueta é um algarismo que ninguém confere duas vezes. Pesos contados, não
         famílias inteiras. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
