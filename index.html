<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PMSYSTEM</title>
    <meta name="description" content="PMSYSTEM — Industrial Maintenance Management System" />
    <meta name="author" content="Applied Nutrition" />

    <!-- Uma marca só, declarada em todos os tamanhos que um browser pede.
         Todos estes ficheiros mostram o mesmo átomo AN; o que estava partido
         era a REAMOSTRAGEM. O 16x16 e o 32x32 tinham sido encolhidos a partir
         do 512 com um filtro de vizinho mais próximo, que num desenho de linha
         fina come as órbitas e deixa uma mancha — era isso que se via no
         separador, não um ícone trocado. Foram refeitos com Lanczos a partir do
         512, e a 16px o átomo é desenhado com as órbitas engrossadas, porque
         uma linha de meio pixel não sobrevive a nenhum filtro. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1F4E79" />
    <!-- iPhone: the Home Screen app is the only place Safari offers push. These make it open
         full screen with its own name; the manifest (display: standalone) already says so. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AN PMSYSTEM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Três vozes, uma tarefa cada. Archivo é a face das chapas de máquina e da
         sinalética: entra só nos títulos e nas placas de secção, nunca em texto corrido.
         Inter faz a interface. Plex Mono faz os números — os deste sistema vêm de
         relógios e de máquinas, e um algarismo composto na mesma face da sua própria
         etiqueta é um algarismo que ninguém confere duas vezes. Pesos contados, não
         famílias inteiras. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

    <!-- O cartão que o WhatsApp e o LinkedIn desenham quando alguém partilha o
         link. Um scraper não corre JavaScript e não resolve caminhos relativos
         com fiabilidade: og:image TEM de ser absoluto, ou o cartão sai sem
         imagem. Era `/og-image.png`. 1200x630 é o formato que ambos esperam. -->
    <link rel="canonical" href="https://anpmsystem.co.uk/" />
    <meta property="og:site_name" content="PMSYSTEM" />
    <meta property="og:url" content="https://anpmsystem.co.uk/" />
    <meta property="og:title" content="PMSYSTEM" />
    <meta property="og:description" content="PMSYSTEM — Industrial Maintenance Management System" />
    <meta property="og:image" content="https://anpmsystem.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PMSYSTEM — Industrial Maintenance Management System" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PMSYSTEM" />
    <meta name="twitter:description" content="PMSYSTEM — Industrial Maintenance Management System" />
    <meta name="twitter:image" content="https://anpmsystem.co.uk/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
